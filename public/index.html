<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyx Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <div id="login-screen">
      <div class="login-box">
        <div class="login-logo">🌙</div>
        <h1>Nyx Mission Control</h1>
        <p>Enter password to continue</p>
        <input type="password" id="login-password" placeholder="Password" autofocus>
        <button id="login-btn" onclick="doLogin()">Login</button>
        <div id="login-error"></div>
      </div>
    </div>
    <div id="dashboard" style="display:none">
      <nav id="sidebar">
        <div class="sidebar-header">
          <span class="logo">🌙</span>
          <span class="logo-text">Nyx</span>
        </div>
        <ul>
          <li class="active" data-section="home" onclick="navigate('home')"><span class="nav-icon">🏠</span><span class="nav-text">Mission Control</span></li>
          <li data-section="agents" onclick="navigate('agents')"><span class="nav-icon">🤖</span><span class="nav-text">The Office</span></li>
          <li data-section="school" onclick="navigate('school')"><span class="nav-icon">📚</span><span class="nav-text">School</span></li>
          <li data-section="polymarket" onclick="navigate('polymarket')"><span class="nav-icon">📊</span><span class="nav-text">Polymarket</span></li>
          <li data-section="trading" onclick="navigate('trading')"><span class="nav-icon">📈</span><span class="nav-text">Trading</span></li>
        </ul>
      </nav>
      <main id="main-content">
        <header id="top-bar">
          <button id="hamburger" onclick="toggleSidebar()">☰</button>
          <h2 id="page-title">Mission Control</h2>
          <div class="top-right">
            <button class="btn-sm" onclick="refreshCurrentSection()">🔄</button>
            <button class="btn-sm" onclick="doLogout()">🚪</button>
          </div>
        </header>
        <div id="content"></div>
      </main>
    </div>
  </div>
  <!-- Modals -->
  <div id="modal-overlay" style="display:none" onclick="closeModal()">
    <div id="modal-content" onclick="event.stopPropagation()">
      <div id="modal-header"><h3 id="modal-title"></h3><button onclick="closeModal()">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
